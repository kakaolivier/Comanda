<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Comanda Digital</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="topbar">
    <a href="cozinha.html" class="brand">COMANDA DIGITAL</a>
    <span class="nav-title">NOVO PEDIDO</span>
    <nav class="prototype-nav"><a class="" href="index.html">Login</a><a class="" href="cadastro.html">Cadastro</a><a
        class="" href="cozinha.html">Cozinha</a><a class="" href="mesas.html">Mesas</a><a class=" active"
        href="novo-pedido.html">Novo pedido</a></nav>
  </header>
  <main class="page">
    <h1 class="main-title">Mesa <span id="numero-mesa">--</span> • Comanda #<span id="numero-comanda">---</span></h1>
    <section class="new-order-wrap">
      <div class="menu-card card">

        <div class="menu-title">Cardápio</div>
        <div id="menu-items">
          <p>Carregando produtos...</p>
        </div>

        <aside class="summary-card card">
          <div class="summary-title">Resumo do pedido</div>
          <div id="summary-items"></div>
          <div class="total-wrap">
            <div class="total-line"><span class="total-label">TOTAL</span><span class="total-value"
                id="summary-total">R$ 0,00</span></div>
            <button class="btn full" onclick="sendToKitchen()">ENVIAR PARA COZINHA</button>
            <div class="total-line" style="margin-top: 20px;">
              <span class="total-label">TOTAL DA COMANDA</span>
              <span class="total-value" id="total-comanda">R$ 0,00</span>
            </div>

            <button class="btn full" id="btn-fechar-comanda" onclick="fecharComanda()" style="margin-top: 12px;">
              FECHAR COMANDA
            </button>
          </div>
        </aside>
    </section>
  </main>
  <div class="notice"></div>
  <script src="js/app.js?v=4"></script>
</body>

</html>
