<main class="page">
  <h1 class="main-title">Mesa 05 • Comanda #1024</h1>
  <section class="new-order-wrap">
    <div class="menu-card card">
      <div class="menu-title">Cardápio</div>
      <div class="menu-row selected"><span class="menu-name">Hambúrguer Artesanal</span><span class="price">R$ 28,00</span><button class="btn small-btn" onclick="addMenuItem(0)">ADICIONAR</button></div>

      <div id="summary-items"></div>
      <div class="total-wrap">
        <div class="total-line"><span class="total-label">TOTAL</span><span class="total-value" id="summary-total">R$ 0,00</span></div>
