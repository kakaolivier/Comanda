<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comanda Digital</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="signup-page">
  <div style="position:absolute;right:28px;top:20px"><nav class="prototype-nav"><a class="" href="index.html">Login</a><a class=" active" href="cadastro.html">Cadastro</a><a class="" href="cozinha.html">Cozinha</a><a class="" href="mesas.html">Mesas</a><a class="" href="novo-pedido.html">Novo pedido</a></nav></div>
  <div class="signup-brand">
    <div class="brand">COMANDA DIGITAL</div>
    <div class="subbrand">Cadastro de usuário</div>
  </div>
  <div class="signup-card card">
    <h1>Criar cadastro</h1>
    <form id="signup-form">
      <div class="field"><label>Nome completo</label><input required></div>
      <div class="field"><label>E-mail</label><input type="email" required></div>
      <div class="field"><label>Senha</label><input type="password" required></div>
      <div class="field"><label>Perfil de acesso</label><select required><option value="">Selecione</option><option>Garçom</option><option>Cozinha</option><option>Administrador</option></select></div>
      <div class="auth-actions"><button class="btn full">SALVAR</button></div>
    </form>
  </div>
</div>
<div class="notice"></div>
<script src="js/app.js"></script></body></html>
